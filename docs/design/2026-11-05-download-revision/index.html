<header class="board-head"><div><h1>CaptainFlash · Android 修订</h1><p>三套候选设计 · 每套三个页面 · 示例任务数据</p></div><div class="switch" aria-label="选择设计方案"><button data-design="a" class="active">A · 轻盈卡片</button><button data-design="b">B · 紧凑工作台</button><button data-design="c">C · 留白编排</button></div></header>

const media=()=>`<div class="preview"><img src="../../android-gui-reference-v3.png" alt="海岸公路媒体预览" style="width:651%;height:auto;max-width:none;transform:translate(-2.83%,-27.1%)"><span class="play">${icon('play')}</span><span class="duration">08:24</span></div><div class="media-title">沿着海岸，慢慢出发</div><div class="meta">视频 · 08:24 · 可用字幕：中文、英文</div><div class="pair">${field('下载内容','<select aria-label="下载内容"><option>视频 + 音频</option><option>仅音频</option><option>仅视频</option></select>')}${field('下载格式','<select aria-label="下载格式"><option>1080p · MP4</option> <option>720p · MP4</option></select>')}</div>${field('字幕','<select aria-label="字幕"><option>中文 · 独立字幕文件</option><option>不下载字幕</option></select>')}${field('保存位置',`${icon('folder')}<span>Download / CaptainFlash</span><button data-feedback="正式版将打开系统目录选择器">更改</button>`)}<button class="primary" data-feedback="设计稿：将创建媒体下载任务">${icon('download')}<span>开始下载</span>${icon('arrow')}</button>`;
const file=()=>`<div class="filehero"><div class="fileicon">${icon('file')}ZIP</div><div><h3>旅行摄影素材包</h3><div class="meta">ZIP 压缩文件 · 248 MB<br>服务器支持断点续传</div></div></div>${field('保存文件名','<input class="filename" aria-label="保存文件名" value="旅行摄影素材包.zip">')}<div class="warning" hidden>扩展名已更改，文件内容不会转换，可能无法正常打开。<button class="restore-ext">恢复 .zip</button></div>${field('保存位置',`${icon('folder')}<span>Download / CaptainFlash</span><button data-feedback="正式版将打开系统目录选择器">更改</button>`)}${field('重名处理','<select aria-label="重名处理"><option>自动编号，保留两个文件</option><option>每次询问</option></select>')}<div class="settingline"><div><strong>保留下载进度</strong><small>暂停或中断后，从已下载的位置继续</small></div><input type="checkbox" checked aria-label="保留下载进度"></div><div class="note">已确认支持续传。若源文件发生变化，继续前会提示重新下载。</div><button class="primary" data-feedback="设计稿：将创建普通文件下载任务">${icon('download')}<span>开始下载 · 248 MB</span>${icon('arrow')}</button>`;
function download(d){return `${title(d==='c'?'收下好内容':'新建下载','媒体和文件，一个入口')}<div class="scroll"><div class="url"><input aria-label="下载地址" value="https://example.com/coast.mp4"><button class="clip" aria-label="从剪贴板获取" data-feedback="正式版仅在点击时读取剪贴板；此处不读取真实剪贴板">${icon('clip')}</button></div><div class="identify">${icon('check')}<span class="recognized">已识别为媒体链接</span><button data-feedback="正式版将重新识别此地址" style="margin-left:auto;background:none;border:0;color:var(--accent)">重新识别</button></div><div class="modes"><button class="media-mode on" data-mode="media">媒体下载</button><button class="file-mode" data-mode="file">普通文件</button></div><div class="download-content">${media()}</div></div>`}
const taskdata=[['coast','沿着海岸，慢慢出发','video','进行中','1080p · MP4 · 386 MB',68,'8.2 MB/s','剩余 00:18'],['zip','旅行摄影素材包.zip','file','已暂停','ZIP · 248 MB',42,'已保留 104 MB','支持断点续传'],['audio','夏日午后现场录音','audio','等待中','M4A · 42 MB',0,'等待空闲下载位',''],['pdf','摄影构图指南.pdf','file','已完成','PDF · 18.6 MB',100,'今天 09:32','打开文件'],['fail','山间徒步记录','video','失败','MP4 · 网络连接中断',31,'已保留进度','重试'],['cancel','城市夜景素材.zip','file','已取消','ZIP · 112 MB',0,'今天 09:15','重新下载']];
let selectedStatus=new Set(),selectedTypes=new Set();
const typename={video:'视频',audio:'音频',file:'其他文件'};
function taskrow(t){const [id,name,type,state,percentLabel,pct,left,right]=t;return `<article class="task ${state==='失败'?'failed':''}" data-task="${id}"><div class="task-top"><div class="typeicon">${icon(type)}</div><div class="task-content"><h3>${name}</h3><div class="meta">${percentLabel}</div></div><div class="task-actions"><button aria-label="${state==='进行中'?'暂停':state==='已暂停'?'继续下载':state==='已完成'?'打开文件':'重试'}" data-task-action="${id}">${icon(state==='进行中'?'pause':state==='已暂停'?'play':state==='已完成'?'folder':'retry')}</button></div></div>${['进行中','已暂停','失败'].includes(state)?`<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${name}下载进度"><span style="width:${pct}%"></span></div>`:'<div style="height:10px"></div>'}<div class="task-stats"><span class="state">${state}${pct>0&&state!=='已完成'?' · '+pct+'%':''}</span><span>${left}</span><span>${right}</span></div></article>`}
function tasks(d){return `${title(d==='c'?'所有任务':'全部任务','每一次下载，都在这里','tasks')}<div class="scroll"><div class="filter" aria-label="状态和类型筛选"><button class="on" data-all>全部</button>${['进行中','等待中','已暂停','已完成','失败','已取消'].map(s=>`<button data-status="${s}" aria-pressed="false">${s}</button>`).join('')}<span class="divider"></span>${['video','audio','file'].map(s=>`<button data-type="${s}" aria-pressed="false">${typename[s]}</button>`).join('')}</div><div class="filterhelp"><span class="filter-summary">全部状态 · 全部类型</span><button data-feedback="同组多选为“或”，状态与类型组合为“且”；全部可清空筛选">筛选说明</button></div><div class="task-list">${taskdata.map(taskrow).join('')}</div></div>`}
const categories=[['theme','外观','主题模式、配色与显示'],['download','下载与功能','断点续传、并发、媒体处理'],['shield','网站与隐私','按网站管理登录和 Cookies'],['bell','通知','下载进度、完成与失败提醒'],['storage','数据与存储','默认目录、缓存、任务记录'],['info','关于','应用版本、解析器与更新'],['file','声明','隐私政策、授权与开源许可']];
function category(i){let [ico,name,sub]=categories[i];return `<button class="category" data-category="${i}"><span class="typeicon">${icon(ico)}</span><span class="cattext"><h3>${name}</h3><p>${sub}</p></span>${icon('chevron')}</button>`}
function settingline(t,s,on){return `<div class="settingline"><div><strong>${t}</strong><small>${s}</small></div>${on===undefined?icon('chevron'):`<input type="checkbox" ${on?'checked':''} aria-label="${t}">`}</div>`}
function detail(i){const items=[['跟随系统主题|自动切换浅色与深色','颜色方案|使用当前方案'],['断点续传|普通文件中断后保留进度|1','并发下载|同时下载 2 个任务','媒体处理|合并视频音频；字幕单独保存'],['网站登录|按网站管理已授权会话','Cookies 文件|只保存引用，不展示敏感内容','清除网站会话|移除所选网站的登录信息'],['系统通知权限|由 Android 系统管理','下载完成提醒|文件保存成功后通知|1','失败提醒|显示原因和重试入口|1'],['默认保存位置|Download / CaptainFlash','清理下载缓存|不删除已完成的文件','清除任务记录|可选择是否同时删除本地文件'],['CaptainFlash|当前安装版本','解析器与更新|查看版本和更新状态','媒体处理能力|查看当前支持的处理方式'],['隐私政策|数据处理与本地存储说明','使用与授权声明|仅下载有权保存的内容','第三方开源许可|组件、许可证和项目来源']];return `<div class="detail-content">${items[i].map(x=>{const [a,b,c]=x.split('|');return settingline(a,b,c===undefined?undefined:c==='1')}).join('')}</div>`}
function settings(d){return `${title(d==='c'?'按你的习惯':'设置','井然有序，随你调整','settings')}<div class="scroll"><div class="category-grid">${categories.map((_,i)=>category(i)).join('')}</div><div class="settings-detail" hidden></div></div>`}
function phone(page,d){return `<div><p class="caption">${{download:'新建下载 · 可切换媒体 / 普通文件',tasks:'任务 · 默认展示全部状态',settings:'设置 · 分类入口'}[page]}</p><section class="phone device-${d}" data-page="${page}">${status()}${{download,tasks,settings}[page](d)}${nav(page)}<div class="snack" role="status"></div></section></div>`}
let design='a';function render(d){design=d;selectedStatus.clear();selectedTypes.clear();document.querySelector('#design-name').textContent=designs[d][0];document.querySelector('#design-desc').textContent=designs[d][1];document.querySelector('#screens').innerHTML=['download','tasks','settings'].map(p=>phone(p,d)).join('');document.querySelectorAll('[data-design]').forEach(b=>b.classList.toggle('active',b.dataset.design===d));if(d!=='a')setMode('file')}
function setMode(m){let p=document.querySelector('[data-page=download]');p.querySelector('.download-content').innerHTML=m==='file'?file():media();p.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));p.querySelector('.recognized').textContent=m==='file'?'已识别为普通文件 · 支持续传':'已识别为媒体链接';p.querySelector('.url input').value=m==='file'?'https://example.com/travel-assets.zip':'https://example.com/coast.mp4'}
function filter(){let p=document.querySelector('[data-page=tasks]');let list=taskdata.filter(t=>(!selectedStatus.size||selectedStatus.has(t[3]))&&(!selectedTypes.size||selectedTypes.has(t[2])));p.querySelector('.task-list').innerHTML=list.length?list.map(taskrow).join(''):'<div class="empty">没有符合条件的任务</div>';p.querySelectorAll('[data-status],[data-type]').forEach(b=>{let on=b.dataset.status?selectedStatus.has(b.dataset.status):selectedTypes.has(b.dataset.type);b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))});p.querySelector('[data-all]').classList.toggle('on',!selectedStatus.size&&!selectedTypes.size);p.querySelector('.filter-summary').textContent=`${selectedStatus.size?[...selectedStatus].join(' / '):'全部状态'} · ${selectedTypes.size?[...selectedTypes].map(t=>typename[t]).join(' / '):'全部类型'} · ${list.length} 项`}
function snack(p,t){let s=p.querySelector('.snack');s.textContent=t;s.classList.add('show');clearTimeout(s.timer);s.timer=setTimeout(()=>s.classList.remove('show'),3200)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.design){render(b.dataset.design);return}let p=b.closest('.phone');if(!p)return;if(b.dataset.mode)setMode(b.dataset.mode);if(b.hasAttribute('data-all')){selectedStatus.clear();selectedTypes.clear();filter()}if(b.dataset.status||b.dataset.type){let s=b.dataset.status?selectedStatus:selectedTypes,v=b.dataset.status||b.dataset.type;s.has(v)?s.delete(v):s.add(v);filter()}if(b.dataset.category){let i=+b.dataset.category;if(design==='b'){let old=b.nextElementSibling;if(old&&old.classList.contains('flat-detail')){old.remove();return}p.querySelectorAll('.flat-detail').forEach(x=>x.remove());b.insertAdjacentHTML('afterend',`<div class="flat-detail">${detail(i)}</div>`)}else{p.querySelector('.category-grid').hidden=true;p.querySelector('.settings-detail').hidden=false;p.querySelector('.settings-detail').innerHTML=`<button class="detail-back">返回全部设置</button><h3 class="detail-title">${categories[i][1]}</h3>${detail(i)}`}}if(b.classList.contains('detail-back')){p.querySelector('.category-grid').hidden=false;p.querySelector('.settings-detail').hidden=true}if(b.classList.contains('restore-ext')){p.querySelector('.filename').value=p.querySelector('.filename').value.replace(/\.[^.]*$/,'')+'.zip';p.querySelector('.warning').hidden=true}if(b.dataset.feedback)snack(p,b.dataset.feedback);if(b.dataset.nav)snack(p,['download','tasks','settings'].includes(b.dataset.nav)?'对照稿：对应页面已并排展示':'保留原有入口；本轮主要展示下载、任务、设置');if(b.dataset.taskAction){let t=taskdata.find(x=>x[0]===b.dataset.taskAction);if(t[3]==='进行中'){t[3]='已暂停';t[6]='已保留进度';t[7]='支持断点续传'}else if(t[3]==='已暂停'){t[3]='进行中';t[6]='从 '+t[5]+'% 继续';t[7]='支持断点续传'}else snack(p,'设计稿：'+b.getAttribute('aria-label'));filter()}});
document.addEventListener('input',e=>{if(e.target.classList.contains('filename'))e.target.closest('.phone').querySelector('.warning').hidden=e.target.value.toLowerCase().endsWith('.zip')});
render(new URLSearchParams(location.search).get('design')||'a');
</script></body></html>
